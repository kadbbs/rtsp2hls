<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLS 播放器</title>
  <!-- 引入 hls.js 用于播放 HLS 流 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2em;
    }
    .player-box {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    video {
      width: 100%;
      max-width: 900px;
      border-radius: 10px;
      background: #000;
      display: block;
      margin: 0 auto;
    }
    .controls {
      margin-top: 20px;
      text-align: center;
    }
    .stream-input {
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      width: 300px;
      margin-right: 10px;
    }
    .play-btn {
      padding: 12px 30px;
      font-size: 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .play-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    .play-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 8px;
    }
    .info code {
      background: #f8f9fa;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📺 HLS 网络播放器</h1>
    
    <div class="player-box">
      <video id="videoPlayer" controls autoplay>
        您的浏览器不支持 HTML5 视频
      </video>
      
      <div class="controls">
        <input type="text" id="streamUrl" class="stream-input" 
               placeholder="输入流路径，如：live/mystream"
               value="live/mystream">
        <button class="play-btn" onclick="playStream()">▶️ 播放</button>
      </div>
      
      <div id="status" class="status" style="display:none;"></div>
      
      <div class="info">
        <h3>💡 使用说明</h3>
        <p style="margin: 10px 0;"><strong>步骤 1:</strong> 先推流到服务器</p>
        <p style="margin-left: 20px; margin-bottom: 10px;">
          <code>ffmpeg -re -i video.mp4 -c copy -f rtsp rtsp://localhost:8555/live/mystream</code>
        </p>
        <p style="margin: 10px 0;"><strong>步骤 2:</strong> 在上方输入流路径并点击播放</p>
        <p style="margin: 10px 0;"><strong>或使用 VLC:</strong></p>
        <p style="margin-left: 20px;">
          <code>http://<span id="serverIp"></span>:8081/live/mystream/playlist.m3u8</code>
        </p>
      </div>
    </div>
  </div>
  
  <script>
    let hls = null;
    
    // 获取服务器 IP
    document.getElementById('serverIp').textContent = window.location.hostname;
    
    // 播放流
    function playStream() {
      const streamPath = document.getElementById('streamUrl').value.trim();
      const video = document.getElementById('videoPlayer');
      const status = document.getElementById('status');
      const btn = document.querySelector('.play-btn');
      
      if (!streamPath) {
        showStatus('请输入流路径', 'error');
        return;
      }
      
      // 将流路径中的 / 替换为 _ 来匹配 HLS 目录名称
      // 例如：live/mystream -> live_mystream
      const dirName = streamPath.replace(/\//g, '_');
      
      // 构建播放 URL（使用当前主机和端口）
      const playlistUrl = window.location.origin + '/' + dirName + '/playlist.m3u8';
      
      console.log('输入流路径:', streamPath);
      console.log('转换后的目录名:', dirName);
      console.log('播放 URL:', playlistUrl);
      console.log('window.location.origin:', window.location.origin);
      showStatus('正在加载：' + playlistUrl, 'success');
      btn.disabled = true;
      btn.textContent = '加载中...';
      
      // 销毁旧的 HLS 实例
      if (hls) {
        hls.destroy();
        hls = null;
      }
      
      // 检查是否支持 HLS.js
      if (Hls.isSupported()) {
        console.log('使用 HLS.js 播放');
        hls = new Hls({
          debug: false,
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 90
        });
        
        hls.loadSource(playlistUrl);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          console.log('HLS 清单已解析');
          showStatus('HLS 清单已加载，开始播放...', 'success');
          video.play().then(() => {
            btn.disabled = false;
            btn.textContent = '▶️ 播放';
          }).catch(err => {
            console.error('自动播放失败:', err);
            btn.disabled = false;
            btn.textContent = '▶️ 播放';
          });
        });
        
        hls.on(Hls.Events.ERROR, function(event, data) {
          console.error('HLS 错误:', data);
          btn.disabled = false;
          btn.textContent = '▶️ 播放';
          
          if (data.fatal) {
            showStatus('HLS 错误：' + data.type, 'error');
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.error('网络错误，尝试恢复...');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.error('媒体错误，尝试恢复...');
                hls.recoverMediaError();
                break;
              default:
                showStatus('无法恢复的错误，请刷新页面', 'error');
                break;
            }
          }
        });
      }
      // 检查是否原生支持 HLS (Safari)
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        console.log('使用原生 HLS 支持');
        video.src = playlistUrl;
        video.addEventListener('loadedmetadata', function() {
          video.play();
          btn.disabled = false;
          btn.textContent = '▶️ 播放';
        });
        video.addEventListener('error', function() {
          btn.disabled = false;
          btn.textContent = '▶️ 播放';
          showStatus('视频加载失败', 'error');
        });
      }
      else {
        btn.disabled = false;
        btn.textContent = '▶️ 播放';
        showStatus('您的浏览器不支持 HLS 播放', 'error');
      }
    }
    
    // 显示状态
    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + type;
      status.style.display = 'block';
      
      // 3 秒后自动隐藏
      setTimeout(() => {
        status.style.display = 'none';
      }, 5000);
    }
    
    // 监听 Enter 键
    document.getElementById('streamUrl').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        playStream();
      }
    });
  </script>
</body>
</html>
